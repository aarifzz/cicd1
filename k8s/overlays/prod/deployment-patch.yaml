apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 3          # prod: more replicas
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: LOG_LEVEL
              value: "warn"
