apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1          # dev: single replica to save cost
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: LOG_LEVEL
              value: "debug"
